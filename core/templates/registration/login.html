{% extends "base.html" %}

{% block content %}
<div style="max-width:400px;margin:80px auto;padding:0 16px;">
  <h2 style="margin-bottom:24px;">Sign In</h2>

  {% if form.errors %}
    <p style="color:#c0392b;margin-bottom:16px;">Invalid username or password.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div style="margin-bottom:16px;">
      <label for="id_username" style="display:block;margin-bottom:4px;font-weight:600;">Username</label>
      <input type="text" name="username" id="id_username" autofocus required
             style="width:100%;padding:8px 12px;border:1px solid #ccc;border-radius:4px;font-size:14px;">
    </div>
    <div style="margin-bottom:24px;">
      <label for="id_password" style="display:block;margin-bottom:4px;font-weight:600;">Password</label>
      <input type="password" name="password" id="id_password" required
             style="width:100%;padding:8px 12px;border:1px solid #ccc;border-radius:4px;font-size:14px;">
    </div>
    <button type="submit"
            style="width:100%;padding:10px;background:#2c3e50;color:#fff;border:none;border-radius:4px;font-size:15px;cursor:pointer;">
      Sign In
    </button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
</div>
{% endblock %}

{% extends "manage/base.html" %}

{% block manage_content %}
<h2>New Customer</h2>

<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <p>
    <label>Company Name<br>
      {{ form.name }}
      {{ form.name.errors }}
    </label>
  </p>
  <p>
    <label>Website<br>
      {{ form.website }}
      {{ form.website.errors }}
    </label>
  </p>
  <button type="submit">Create Customer</button>
  &nbsp;<a href="{% url 'manage_home' %}">Cancel</a>
</form>
{% endblock %}
